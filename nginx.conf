server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Proxy Directus — same-origin trick เพื่อหลีกเลี่ยง CORS
    location /directus/ {
        proxy_pass https://kenzchirodesksetup-directus-98ec69-72-62-251-164.traefik.me/;
        proxy_ssl_verify off;

        proxy_set_header Host kenzchirodesksetup-directus-98ec69-72-62-251-164.traefik.me;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Strip CORS headers จาก upstream (Nginx จัดการเองผ่าน same-origin)
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # SPA fallback — React Router support
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
